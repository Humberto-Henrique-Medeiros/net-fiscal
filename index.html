 useEffect(()=>{if(sess===undefined)return;if(!sess){setMe(null);return}sb.from('profiles').select('*').eq('id',uid).maybeSingle().then(({data})=>setMe(data||null))},[uid,sess===undefined]);
 const act=me&&me.status==='ativo';
 useEffect(()=>{if(!act)return;setProg('Conectando…');(async()=>{try{const [rs,c,h,rp]=await Promise.all([loadRows((a,b)=>setProg(a+' / '+b+' linhas')),sb.from('carga_netsuite').select('*'),sb.from('historico').select('*').order('created_at',{ascending:false}).limit(200),sb.from('ref_planilha').select('k,v')]);
  const rf=Object.fromEntries((rp.data||[]).map(x=>[x.k,x.v]));if(rf.itens&&rf.regras){D.items=rf.itens;D.rules=rf.regras;D.conf=rf.conflitos||[];D.carga=rf.carga||{};CON=new Set(D.conf);D.tot={...D.tot,...(rf.tot||{})}}setMeta(rf.meta||null);const e={};rs.forEach((x,i)=>{if(x.ncm_override||x.tipo_sped_override)e[i]={n:x.ncm_override||undefined,t:x.tipo_sped_override||undefined}});setRows(rs.map(mapRow));setE(e);
  const s={};(c.data||[]).forEach(x=>s[x.chave]={ncm:x.ncm,cfop:x.cfop,ue:x.uf_emit,ud:x.uf_dest});setS(s);setH((h.data||[]).map(x=>({t:x.created_at,u:x.user_email,m:x.mensagem})));setErr('')}catch(x){setErr(x.message)}setProg('')})()},[act,reload]);
 const res=useMemo(()=>rows.map((r,i)=>calc(r,ed[i]||{},sent)),[rows,ed,sent]);
 const q=p=>p.then(r=>{if(r.error)alert('Erro no banco: '+r.error.message);return r});
 const persist=(i,p)=>{const r=rows[i];if(r)q(sb.from('movimentacoes_nfe').update({...p,updated_at:new Date().toISOString(),updated_by:uid}).eq('id',r.id))};
 const log=m=>{setH(h=>[{t:new Date().toISOString(),u:me.email,m},...h].slice(0,200));sb.from('historico').insert({user_email:me.email,mensagem:m}).then(()=>{})};
 const setSent=v=>{const o=sent;setS(v);Object.keys(v).filter(k=>!o[k]).forEach(k=>q(sb.from('carga_netsuite').upsert({chave:k,ncm:v[k].ncm,cfop:v[k].cfop,uf_emit:v[k].ue,uf_dest:v[k].ud})));Object.keys(o).filter(k=>!v[k]).forEach(k=>q(sb.from('carga_netsuite').delete().eq('chave',k)))};
 const addKey=(x,ue,ud)=>{setSent({...sent,[x.key]:{ncm:x.ncm,cfop:x.cfop,ue,ud}});log('Enviado para carga: '+x.key)};
 const addSent=i=>addKey(res[i],rows[i].ue,rows[i].ud);
 if(sess===undefined||me===undefined)return html`<div class="p-10 text-stone-600">Conectando…</div>`;
 if(!sess||!me)return html`<${Login}/>`;
 if(me.status!=='ativo')return html`<div class="min-h-screen flex items-center justify-center p-4"><${Card} class="max-w-md p-8 text-center"><h1 class="serif text-2xl font-bold mb-2">${me.status==='bloqueado'?'Acesso bloqueado':'Aguardando aprovação'}</h1><p class="text-stone-600 mb-4">${me.status==='bloqueado'?'Fale com o Administrador.':'O Administrador precisa aprovar seu acesso.'}</p><${Btn} onClick=${()=>sb.auth.signOut()}>Sair</${Btn}></${Card}></div>`;
 if(prog)return html`<div class="min-h-screen flex items-center justify-center"><${Card} class="p-8 text-center"><div class="serif text-xl font-bold mb-1">Carregando movimentações…</div><div class="text-stone-600">${prog}</div></${Card}></div>`;
 const canEdit=me.role!=='LEITOR';
 const nav=[['painel','Painel','dash'],['aud','Auditoria CFOP','chk'],['nfe','Leitor NF-e','fil'],['sim','Simulador','zap'],['carga','Carga NetSuite','up'],['hist','Histórico','clk'],['eq','Equipe','usr']];
 return html`<div class="flex min-h-screen"><aside class="side w-52 sm:w-60 shrink-0 text-white p-3 flex flex-col sticky top-0 h-screen"><div class="flex items-center gap-2 px-2 py-3 serif font-bold leading-tight"><${Ic} n="shd" s=${24}/>Auditoria CFOP<br/>SuiteTax</div>
 <nav class="mt-3 space-y-1 flex-1">${nav.map(([k,l,i])=>html`<button onClick=${()=>{setPf('');setPg(k)}} class=${'w-full flex items-center gap-2.5 text-left px-3 py-2.5 rounded-xl text-sm font-semibold '+(pg===k?'bg-[#f1efe6] text-[#234B3A]':'text-white/85 hover:bg-white/10')}><${Ic} n=${i} s=${17}/>${l}</button>`)}</nav>
 <div class="border-t border-white/15 pt-3 text-xs"><div class="font-bold uppercase truncate">${me.nome||me.email}</div><div class="opacity-70 mb-2">${me.role}</div><button class="flex items-center gap-1.5 border border-white/30 rounded-lg px-3 py-1.5" onClick=${()=>sb.auth.signOut()}><${Ic} n="out" s=${14}/>Sair</button></div></aside>
 <main class="flex-1 p-4 sm:p-6 min-w-0">${err&&html`<p class="text-rose-700 text-sm mb-3">Erro: ${err}</p>`}${pg==='nfe'?html`<${Reader} allRows=${rows} allRes=${res} sent=${sent} addKey=${addKey} canEdit=${canEdit} log=${log}/>`:pg==='sim'?html`<${Sim} sent=${sent} addKey=${addKey} canEdit=${canEdit}/>`:pg==='hist'?html`<${Hist} hist=${hist}/>`
 :pg==='aud'?html`<${Audit} init=${pf} key=${'a'+pf} res=${res} rows=${rows} ed=${ed} setEd=${setE} sent=${sent} addSent=${addSent} canEdit=${canEdit} log=${log} persist=${persist}/>`:pg==='carga'?html`<${Carga} res=${res} rows=${rows} sent=${sent} setSent=${setSent} canEdit=${canEdit}/>`:pg==='eq'?html`<${Team} me=${me} log=${log}/>`
 :html`<div><${Panel} meta=${meta} res=${res} rows=${rows} go=${(p,f)=>{setPf(f||'');setPg(p)}}/>${me.role==='ADMIN'&&html`<${Importer} count=${rows.length} done=${()=>setReload(r=>r+1)} log=${log}/><${Updater} me=${me} done=${()=>setReload(r=>r+1)} log=${log}/>`}</div>`}</main></div>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
